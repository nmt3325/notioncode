name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODE_MCP_RUNTIME_DIR: /tmp/notioncode-opencode-runtime
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript
        run: npm run build

      - name: Prepare pinned OpenCode runtime
        run: npm run setup:native

      - name: Typecheck native integration
        run: npm run typecheck:native

      - name: Run unit and native integration tests
        run: npm test

      - name: Test the real OpenCode host
        run: npm run test:opencode

      - name: Test a fresh production package install
        run: npm run test:package

      - name: Create installable package and checksum
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          (cd artifacts && sha256sum -- *.tgz > SHA256SUMS)

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notioncode-${{ github.sha }}
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
